<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="tabs" aria-label="Views">
    <button type="button" class="tab" data-view="today">Today</button>
    <button type="button" class="tab" data-view="week">This Week</button>
    <button type="button" class="tab" data-view="month">This Month</button>
  </nav>
  <p class="save-error" id="save-error" hidden>Couldn't save to data.json. Is the server still running?</p>
  <main id="main" class="main"><p class="muted">Loading…</p></main>
  <script src="dates.js"></script>
  <script src="app.js"></script>
</body>
</html>
